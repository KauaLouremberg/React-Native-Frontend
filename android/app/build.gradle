def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, "local.properties")

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader { reader ->
        localProperties.load(reader)
    }
}


def API_URL = localProperties.getProperty("API_URL")


apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"


react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    namespace "com.frontend"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        applicationId "com.frontend"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "API_URL", "\"${API_URL}\""
        manifestPlaceholders = [
            MAPS_API_KEY: localProperties.getProperty("MAPS_API_KEY")
        ]
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst '**/*.so'
    }
}

configurations.all {
    resolutionStrategy {
        force 'com.google.android.gms:play-services-base:18.5.0'
        force 'com.google.android.gms:play-services-basement:18.5.0'
        force 'com.google.android.gms:play-services-location:21.3.0'
        force 'com.google.android.gms:play-services-maps:18.2.0'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'com.google.android.gms:play-services-basement:18.5.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation "com.squareup.okhttp3:okhttp:4.10.0"



    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: "com.google.gms.google-services"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
